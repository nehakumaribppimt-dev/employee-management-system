spring.application.name=employee-management-system
#server.port=2026

#Database Congifuration

#providing database url -: syntax = protocol:database:where database is hosted/name of database
spring.datasource.url=jdbc:mysql://localhost:3306/EmployeeManagement
#username
spring.datasource.username=root
#password
spring.datasource.password=password
#jdbc driver name
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#whenever i make any changes in schema,those updates should be propagate in db automatically
spring.jpa.hibernate.ddl-auto=update
#we are telling hibernate to use mysql language
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG


#email setup config

#SMPT host for sending emails via gmail
spring.mail.host=smtp.gmail.com
#SMTP port(587 for TLS, 465 for SSL)
spring.mail.port=587

spring.mail.username=nehakumari@gmail.com
spring.mail.password=abcdefgh

#enabling authenication for outgoing emails
spring.mail.properties.mail.smtp.auth=true

#enables STARTTLS for secure email sending
spring.mail.properties.mail.smtp.starttls.enable=true